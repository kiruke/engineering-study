      "prompt": "Rubyメソッド unique_long_words(words, min_length) を実装してください。文字列配列から、文字数がmin_length以上の単語だけを小文字に変換し、重複を除いた配列を最初の出現順で返します。元の配列と文字列を変更してはいけません。\n\nunique_long_words([\"Ruby\", \"ruby\", \"RAILS\", \"Go\", \"rails\"], 4) # => [\"ruby\", \"rails\"]\nunique_long_words([\"A\", \"BB\"], 3) # => []\nunique_long_words([], 2) # => []\n\nまずヒントなしでメソッド全体を提出してください。",
      "reference_solution": "def unique_long_words(words, min_length)\n  words.map(&:downcase).select { |word| word.length >= min_length }.uniq\nend",
      "alternative_solution": "def unique_long_words(words, min_length)\n  words.each_with_object([]) do |word, result|\n    normalized = word.downcase\n    result << normalized if normalized.length >= min_length && !result.include?(normalized)\n  end\nend",
      "explanation": "mapで元文字列を変更せず小文字化、selectで長さを絞り、uniqで出現順を維持して重複を除く。",
      "hint_steps": [
        "小文字化は破壊的なdowncase!ではなくdowncaseを使う。",
        "条件に合う単語をselectで絞る。",
        "配列の重複除去にuniqを使う。"
      ],
      "review_type": "new"
    },
