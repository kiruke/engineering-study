    type: multiple_choice
    question: |
      count=0
      (1..3).each do |i|
        (1..i).each do |j|
          if j<i
            count+=1
          end
        end
      end
      puts count
    options: {A: "2", B: "3", C: "4", D: "6"}
    correct_answer: B
    explanations:
      A: "i=3で条件が2回成立することを見落とす。"
      B: "成立回数はi=1で0、i=2で1、i=3で2、合計3。"
      C: "成立しない組み合わせを含めている。"
      D: "6はループ総回数で、条件成立回数ではない。"
