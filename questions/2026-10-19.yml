    topics: [left_join, count, null]
    type: multiple_choice
    question: |
      books: (1,Ruby入門),(2,Rails入門),(3,SQL入門)
      reviews: (1,book_id=1,rating=5),(2,book_id=1,rating=3),(3,book_id=2,rating=4)
      SELECT books.title, COUNT(reviews.id) AS review_count
      FROM books LEFT JOIN reviews ON books.id = reviews.book_id
      GROUP BY books.id, books.title ORDER BY books.id;
    options:
      A: "Ruby入門=2、Rails入門=1（SQL入門は表示されない）"
      B: "Ruby入門=2、Rails入門=1、SQL入門=0"
      C: "Ruby入門=2、Rails入門=1、SQL入門=1"
      D: "Ruby入門=1、Rails入門=1、SQL入門=0"
    correct_answer: B
    explanations:
      A: "LEFT JOINではレビューがないSQL入門も残る。"
      B: "左表の全行を残し、COUNT(reviews.id)はNULLを数えない。"
      C: "レビューがない本のreviews.idはNULLであり0件。"
      D: "Ruby入門には2件のレビューがある。"
