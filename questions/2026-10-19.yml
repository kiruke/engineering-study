    topics: [stack, queue, lifo, fifo, tracing]
    type: multiple_choice
    question: |
      空のスタックS: push(10),push(20),push(30),pop(),push(40),pop()
      空のキューQ: enqueue(10),enqueue(20),enqueue(30),dequeue(),enqueue(40),dequeue()
      最後のSの上とQの先頭は？
    options:
      A: "S=20、Q=30"
      B: "S=30、Q=30"
      C: "S=20、Q=20"
      D: "S=10、Q=40"
    correct_answer: A
    explanations:
      A: "Sは[10,20]、Qは[30,40]になる。"
      B: "スタックの30は最初のpopで除かれる。"
      C: "キューの20は2回目のdequeueで除かれる。"
      D: "先頭・最上段を取り違えている。"
  - id: "20261019-08"
    category: fundamental_it
    topics: [binary_search, tracing]
    type: multiple_choice
    question: |
      data=[2,5,8,12,16,21,27], target=16
      left=0; right=data.length-1; count=0
      while left<=right
        mid=(left+right)/2
        count+=1
        if data[mid]==target
          break
        elsif data[mid]<target
          left=mid+1
        else
          right=mid-1
        end
      end
      puts count
    options: {A: "1", B: "2", C: "3", D: "4"}
    correct_answer: C
    explanations:
      A: "初回mid=3で12。"
      B: "2回目mid=5で21、まだ一致しない。"
      C: "3回目mid=4で16に一致。"
      D: "3回目でbreakする。"
  - id: "20261019-09"
