      "review_source": "attempts/2026-10-20.yml",
      "reference_solution": "def sum_positive_evens(numbers)\n  total = 0\n  numbers.each do |n|\n    total += n if n > 0 && n.even?\n  end\n  total\nend",
      "alternative_solution": "def sum_positive_evens(numbers)\n  numbers.sum { |n| n > 0 && n.even? ? n : 0 }\nend",
      "hint_steps": [
        "eachの前に合計値を0で初期化する。",
        "nが正の偶数のときだけ合計値を増やす。",
