      "prompt": "Rubyメソッド sum_positive_evens(numbers) を自力で実装してください。\n整数の配列から「0より大きい偶数」だけを合計して整数で返します。配列を変更しないこと。\n\n例:\nsum_positive_evens([-4, 0, 2, 3, 8, 9]) # => 10\nsum_positive_evens([1, 3, -2])        # => 0\nsum_positive_evens([])                 # => 0\n\nヒントなしでコードを提出してください。",
